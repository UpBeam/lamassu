name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - name: Verify installed browser assets outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from importlib.resources import files; assert all(files('lamassu').joinpath('web', name).is_file() for name in ['index.html', 'style.css', 'app.js', 'upbeam.jpg'])"
      - run: node --check lamassu/web/app.js
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.0
      - run: ruff check lamassu tests
      - run: ruff format --check lamassu tests
